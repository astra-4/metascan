<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Case File - MetaScan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <div class="page">
        <div class="nav">
            <a class="brand" href="index.html">MetaScan</a>
            <div class="nav-right">
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☾</button>
            </div>
        </div>
        <div class="report-wrap">
            <div class="case-header">
                <div class="case-title">Case File #<span id="caseNum">67</span></div>
                <div class="case-sub">Evidence found in <span id="caseFileName">photo.jpg</span></div>
            </div>

            <div class="score-card">
                <svg viewBox="0 0 200 120" class="gauge">
                    <path d="M 10 110 A 90 90 0 0 1 190 110" class="gauge-track"></path>
                    <path d="M 10 110 A 90 90 0 0 1 190 110" class="gauge-fill" id="gaugeFill"></path>
                </svg>
                <div class="gauge-number" id="scoreNum">--</div>
                <div class="gauge-label">/ 100</div>
                <div class="risk-badge" id="riskBadge">Checking...</div>
                <div class="breakdown" id="breakdownList"></div>
            </div>

            <div class="cards-grid" id="cardsGrid"></div>

            <div class="section-block">
                <div class="section-title">Recommended Actions</div>
                <ul class="reco-list" id="recoList"></ul>
            </div>

            <div class="section-block">
                <div class="section-title">Metadata Explorer</div>
                <div class="explorer" id="explorer"></div>
            </div>


            <!--sanitizing stuff-->
                <div class="section-block">
                    <div class="section-title">Sanitize Image</div>
                    <p class="section-note">Makes a cleaned up copy: blurs faces, blurs the QR code, and strips out the metadata.</p>
                    <button class="btn btn-primary" id="sanitizeBtn" onclick="sanitizeImage()">Sanitize Image</button>

                    <div class="before-after" id="beforeAfter" style="display:none;">
                    <div class="ba-col">
                        <div class="ba-label">Original</div>
                        <img id="originalImg" class="ba-img">
                    </div>
                    <div class="ba-col">
                        <div class="ba-label">Sanitized</div>
                        <canvas id="sanitizedCanvas" class="ba-img"></canvas>
                        <a class="btn btn-primary" id="downloadLink" download="sanitized.png">Download</a>
                    </div>
                    </div>
                </div>
            <a href="index.html" class="back-link">← scan another photo</a>
        </div>
    </div>

    <div class="map-modal-backdrop" id="mapModalBackdrop" onclick="if(event.target===this) closeMapModal()">
        <div class="map-modal">
            <button type="button" class="btn btn-ghost map-modal-close" onclick="closeMapModal()">✕ Close</button>
            <div id="gpsMapModal" class="map-modal-frame"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
